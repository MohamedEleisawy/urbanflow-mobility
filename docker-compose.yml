# =============================================================================
# UrbanFlow Mobility — orchestration de développement
# =============================================================================
# Étape 2A : ajout de PostgreSQL + PostGIS. Redis sera ajouté à l'étape
# correspondante.
#
#   docker compose up --build
# =============================================================================

services:
  postgres:
    # Image officielle PostGIS : un PostgreSQL standard avec l'extension
    # PostGIS déjà installée. Elle est activée automatiquement sur la base
    # POSTGRES_DB au premier démarrage du conteneur.
    image: postgis/postgis:16-3.4
    environment:
      # Identifiants de développement local uniquement — jamais utilisés en
      # production (voir CLAUDE.md, section Sécurité par défaut).
      POSTGRES_USER: ${POSTGRES_USER:-urbanflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-urbanflow_dev}
    ports:
      - '5432:5432'
    volumes:
      # Les données survivent aux redémarrages du conteneur.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-urbanflow}']
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./projet
      dockerfile: docker/frontend.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    volumes:
      # Le code est monté pour le hot-reload ; node_modules reste celui de
      # l'image (volume anonyme) afin d'éviter les conflits hôte/conteneur.
      - ./projet/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    build:
      context: ./projet
      dockerfile: docker/backend.Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      CARBON_SERVICE_URL: http://carbon-service:8000
      # Host "postgres" = nom du service ci-dessus, résolu par le réseau
      # Docker interne (pas "localhost", qui désignerait le conteneur backend).
      DATABASE_URL: postgresql://${POSTGRES_USER:-urbanflow}:${POSTGRES_PASSWORD:-urbanflow_dev_password}@postgres:5432/${POSTGRES_DB:-urbanflow_dev}?schema=public
      # Secret de développement uniquement (voir .env.example) — jamais utilisé en production.
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-local-avec-openssl-rand-hex-32}
    volumes:
      - ./projet/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      carbon-service:
        condition: service_started

  carbon-service:
    build:
      context: ./projet
      dockerfile: docker/carbon-service.Dockerfile
    ports:
      - '8000:8000'
    environment:
      CARBON_ENVIRONMENT: development
    volumes:
      - ./projet/carbon-service/app:/app/app

volumes:
  postgres_data:
